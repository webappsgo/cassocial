name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: windows
            arch: arm64
            ext: ".exe"
          - os: freebsd
            arch: amd64
            ext: ""
          - os: freebsd
            arch: arm64
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        uses: actions/setup-go@78961f6f84d799cd858575bb931c3e51d3b13290
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine version
        id: version
        run: |
          if [ -f release.txt ]; then
            VERSION=$(cat release.txt | tr -d '[:space:]')
          elif [ -n "${{ github.ref_name }}" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="0.0.0-$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "yymm=$(date -u +%y%m)" >> "$GITHUB_OUTPUT"

      - name: Build server binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -buildvcs=false \
            -ldflags "-s -w \
              -X 'main.Version=${{ steps.version.outputs.version }}' \
              -X 'main.CommitID=${{ steps.version.outputs.commit }}' \
              -X 'main.BuildDate=${{ steps.version.outputs.build_date }}' \
              -X 'main.OfficialSite=https://casjay.link'" \
            -o binaries/cassocial-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./src

      - name: Build client binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -buildvcs=false \
            -ldflags "-s -w \
              -X 'main.Version=${{ steps.version.outputs.version }}' \
              -X 'main.CommitID=${{ steps.version.outputs.commit }}' \
              -X 'main.BuildDate=${{ steps.version.outputs.build_date }}' \
              -X 'main.OfficialSite=https://casjay.link'" \
            -o binaries/cassocial-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./src/client

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum cassocial-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} \
            > cassocial-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}.sha256
          sha256sum cassocial-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} \
            > cassocial-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}.sha256

      - name: Attest server binary
        uses: actions/attest-build-provenance@f14352a605c57b0a66e0d49bba5825967f1dbedf
        with:
          subject-path: binaries/cassocial-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

      - name: Attest client binary
        uses: actions/attest-build-provenance@f14352a605c57b0a66e0d49bba5825967f1dbedf
        with:
          subject-path: binaries/cassocial-cli-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cassocial-${{ matrix.os }}-${{ matrix.arch }}
          path: binaries/
          retention-days: 7

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Determine version
        id: version
        run: |
          if [ -f release.txt ]; then
            VERSION=$(cat release.txt | tr -d '[:space:]')
          elif [ -n "${{ github.ref_name }}" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="0.0.0-$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "yymm=$(date -u +%y%m)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c887d9748da14dcb42b11cf8bcc773b301ea55b5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@3864d6aed8ff134b2ed894ce00c87695c709c870
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@ff26911fd365b0233252dfbd8eede1c0e9ef9a51
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/casapps/cassocial:${{ steps.version.outputs.version }}
            ghcr.io/casapps/cassocial:latest
            ghcr.io/casapps/cassocial:${{ steps.version.outputs.yymm }}
            ghcr.io/casapps/cassocial:${{ github.sha }}

      - name: Attest Docker image
        uses: actions/attest-build-provenance@f14352a605c57b0a66e0d49bba5825967f1dbedf
        with:
          subject-name: ghcr.io/casapps/cassocial
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true

      - name: Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --no-progress \
              ghcr.io/casapps/cassocial:${{ github.sha }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Download all artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: all-binaries
          path: binaries/

      - name: Determine version
        id: version
        run: |
          if [ -f release.txt ]; then
            VERSION=$(cat release.txt | tr -d '[:space:]')
          elif [ -n "${{ github.ref_name }}" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="0.0.0-$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "cassocial ${{ steps.version.outputs.version }}" \
            --generate-notes \
            binaries/ 2>/dev/null || true
