{{template "base" .}}

{{define "content"}}
<div class="container">
  <div class="card card-login">
    <div class="card-header">
      <h1 class="card-title text-center">Sign In</h1>
    </div>
    <div class="card-body">
      {{if .FlashError}}
      <div class="alert alert-danger" role="alert">
        <span>{{.FlashError}}</span>
        <button class="alert-close" aria-label="Dismiss">&times;</button>
      </div>
      {{end}}
      {{if .FlashSuccess}}
      <div class="alert alert-success" role="alert">
        <span>{{.FlashSuccess}}</span>
        <button class="alert-close" aria-label="Dismiss">&times;</button>
      </div>
      {{end}}

      <form method="POST" action="/auth/login" novalidate>
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text"
                 id="username"
                 name="username"
                 autocomplete="username"
                 required
                 aria-required="true"
                 value="{{.FormUsername}}">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password"
                 id="password"
                 name="password"
                 autocomplete="current-password"
                 required
                 aria-required="true">
        </div>

        <button type="submit" class="btn btn-primary btn-rounded w-full">Sign In</button>
      </form>

      <p class="text-center mt-2">
        <a href="/auth/forgot-password">Forgot your password?</a>
      </p>
    </div>
    {{if .RegistrationEnabled}}
    <div class="card-footer text-center">
      <p class="footer-text">
        Don&rsquo;t have an account? <a href="/auth/register">Create one</a>
      </p>
    </div>
    {{end}}
  </div>
</div>
{{end}}
