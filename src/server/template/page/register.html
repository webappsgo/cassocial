{{template "base" .}}

{{define "content"}}
<div class="container">
  <div class="card card-register">
    <div class="card-header">
      <h1 class="card-title text-center">Create Account</h1>
    </div>
    <div class="card-body">
      {{if .FlashError}}
      <div class="alert alert-danger" role="alert">
        <span>{{.FlashError}}</span>
        <button class="alert-close" aria-label="Dismiss">&times;</button>
      </div>
      {{end}}

      <form method="POST" action="/auth/register" novalidate>
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text"
                 id="username"
                 name="username"
                 autocomplete="username"
                 minlength="3"
                 maxlength="30"
                 required
                 aria-required="true"
                 aria-describedby="username-help"
                 value="{{.FormUsername}}">
          <span id="username-help" class="form-help">3&ndash;30 characters. Letters, numbers, hyphens, and underscores.</span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email"
                 id="email"
                 name="email"
                 autocomplete="email"
                 required
                 aria-required="true"
                 value="{{.FormEmail}}">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password"
                 id="password"
                 name="password"
                 autocomplete="new-password"
                 minlength="8"
                 required
                 aria-required="true"
                 aria-describedby="password-help">
          <span id="password-help" class="form-help">Minimum 8 characters.</span>
        </div>

        <div class="form-group">
          <label for="password_confirm">Confirm Password</label>
          <input type="password"
                 id="password_confirm"
                 name="password_confirm"
                 autocomplete="new-password"
                 required
                 aria-required="true">
        </div>

        <button type="submit" class="btn btn-primary btn-rounded w-full">Create Account</button>
      </form>
    </div>
    <div class="card-footer text-center">
      <p class="footer-text">
        Already have an account? <a href="/auth/login">Sign in</a>
      </p>
    </div>
  </div>
</div>
{{end}}
