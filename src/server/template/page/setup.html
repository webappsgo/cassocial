<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First-Run Setup | {{.SiteName}}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="icon" href="/static/images/logo.svg" type="image/svg+xml">
  <script src="/static/js/theme-init.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content">
    <div class="container">
      <div class="card card-setup">
        <div class="card-header text-center">
          <img src="/static/images/logo.svg" alt="{{.SiteName}}" class="logo mb-2" width="160" height="48">
          <h1 class="card-title">Welcome to {{.SiteName}}</h1>
          <p class="text-secondary">Step {{.Step}} of {{.TotalSteps}}: {{.StepTitle}}</p>
        </div>
        <div class="card-body">
          {{if .FlashError}}
          <div class="alert alert-danger" role="alert">
            <span>{{.FlashError}}</span>
          </div>
          {{end}}

          <form method="POST" action="/setup/complete" novalidate>
            <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

            <div class="form-group">
              <label for="admin_username">Admin Username</label>
              <input type="text"
                     id="admin_username"
                     name="admin_username"
                     autocomplete="username"
                     minlength="3"
                     maxlength="30"
                     required
                     aria-required="true"
                     aria-describedby="admin-username-help">
              <span id="admin-username-help" class="form-help">This will be your administrator login name.</span>
            </div>

            <div class="form-group">
              <label for="admin_email">Admin Email</label>
              <input type="email"
                     id="admin_email"
                     name="admin_email"
                     autocomplete="email"
                     required
                     aria-required="true">
            </div>

            <div class="form-group">
              <label for="admin_password">Admin Password</label>
              <input type="password"
                     id="admin_password"
                     name="admin_password"
                     autocomplete="new-password"
                     minlength="8"
                     required
                     aria-required="true"
                     aria-describedby="admin-password-help">
              <span id="admin-password-help" class="form-help">Minimum 8 characters. Choose a strong password.</span>
            </div>

            <div class="form-group">
              <label for="admin_password_confirm">Confirm Password</label>
              <input type="password"
                     id="admin_password_confirm"
                     name="admin_password_confirm"
                     autocomplete="new-password"
                     required
                     aria-required="true">
            </div>

            <button type="submit" class="btn btn-primary btn-rounded w-full btn-lg">
              Complete Setup
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/js/main.js"></script>
</body>
</html>
