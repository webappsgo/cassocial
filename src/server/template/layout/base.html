<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#282a36" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  {{if .MetaTitle}}<title>{{.MetaTitle}} | {{.SiteName}}</title>{{else}}<title>{{.SiteName}}</title>{{end}}
  {{if .MetaDescription}}<meta name="description" content="{{.MetaDescription}}">{{end}}
  {{if .OgImageURL}}<meta property="og:image" content="{{.OgImageURL}}">{{end}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{.SiteName}}">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="icon" href="/static/images/logo.svg" type="image/svg+xml">
  <script src="/static/js/theme-init.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  {{template "header" .}}

  <main id="main-content">
    {{template "content" .}}
  </main>

  {{template "footer" .}}

  <script src="/static/js/main.js"></script>
</body>
</html>
