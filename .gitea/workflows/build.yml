name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches:
      - main
      - master
      - devel
  workflow_dispatch:

concurrency:
  group: build-${{ gitea.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECTNAME: cassocial

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    container: golang:alpine

    steps:
      - name: Install git
        run: apk add --no-cache git

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Set build info
        run: |
          if [ -f release.txt ]; then
            echo "VERSION=$(cat release.txt)" >> $GITEA_ENV
          else
            echo "VERSION=0.0.0-dev" >> $GITEA_ENV
          fi
          echo "COMMIT_ID=$(git rev-parse --short HEAD)" >> $GITEA_ENV
          echo "BUILD_DATE=$(date +"%a %b %d, %Y at %H:%M:%S %Z")" >> $GITEA_ENV
          if [ -f site.txt ]; then
            echo "OFFICIALSITE=$(cat site.txt)" >> $GITEA_ENV
          else
            echo "OFFICIALSITE=${{ secrets.OFFICIALSITE }}" >> $GITEA_ENV
          fi

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build server
        env:
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildDate=${{ env.BUILD_DATE }}' -X 'main.OfficialSite=${{ env.OFFICIALSITE }}'"
          go build -buildvcs=false -ldflags "${LDFLAGS}" -o /tmp/cassocial ./src

      - name: Build CLI
        if: hashFiles('src/client/') != ''
        env:
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildDate=${{ env.BUILD_DATE }}' -X 'main.OfficialSite=${{ env.OFFICIALSITE }}'"
          go build -buildvcs=false -ldflags "${LDFLAGS}" -o /tmp/cassocial-cli ./src/client

      - name: Test with coverage
        env:
          CGO_ENABLED: 0
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./...
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN{exit !(${COVERAGE} < 60)}"; then
            echo "::error::Coverage ${COVERAGE}% is below the required 60% threshold"
            exit 1
          fi

  validate:
    name: Repo Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check release.txt exists
        run: |
          if [ ! -f release.txt ]; then
            echo "ERROR: release.txt is required"
            exit 1
          fi
          echo "release.txt: $(cat release.txt)"

      - name: Validate go.mod
        run: |
          if [ ! -f go.mod ]; then
            echo "ERROR: go.mod is required"
            exit 1
          fi

      - name: Check src/client exists
        run: |
          if [ ! -d src/client ]; then
            echo "ERROR: src/client/ is required (PART 33)"
            exit 1
          fi

      - name: Check CLAUDE.md exists
        run: |
          if [ ! -f CLAUDE.md ]; then
            echo "ERROR: CLAUDE.md is required"
            exit 1
          fi
