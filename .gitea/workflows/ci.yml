name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: gitea.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/share/go/pkg/mod
            /usr/local/share/go/cache
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: go vet ./...
      - run: staticcheck ./...

  test:
    if: gitea.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/share/go/pkg/mod
            /usr/local/share/go/cache
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Run tests with coverage
        run: |
          mkdir -p "/tmp/${{ gitea.repository_owner }}"
          COVDIR=$(mktemp -d "/tmp/${{ gitea.repository_owner }}/$(basename "${{ gitea.repository }}")-XXXXXX")
          echo "COVDIR=$COVDIR" >> "$GITEA_ENV"
          go test -cover -coverprofile="$COVDIR/coverage.out" ./...
      - name: Enforce coverage threshold
        run: |
          THRESHOLD=60
          PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          if [ "$PCT" -lt "$THRESHOLD" ]; then
            echo "::error::coverage $PCT% < threshold $THRESHOLD%"
            exit 1
          fi

  build:
    if: gitea.event_name != 'schedule'
    needs: [lint, test]
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/share/go/pkg/mod
            /usr/local/share/go/cache
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Build all supported server and client platforms
        run: |
          mkdir -p binaries
          VERSION=$(git rev-parse --short=7 HEAD)
          COMMIT_ID=$(git rev-parse --short=7 HEAD)
          BUILD_EPOCH=$(date -u +%s)
          BUILD_DATE=$(date -u -d "@$BUILD_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
          if [ -f site.txt ]; then OFFICIAL_SITE=$(cat site.txt); else OFFICIAL_SITE=""; fi
          LDFLAGS="-s -w -X main.Version=$VERSION -X main.CommitID=$COMMIT_ID -X main.BuildEpoch=$BUILD_EPOCH -X main.OfficialSite=$OFFICIAL_SITE"
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64 freebsd/arm64; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            ext=""
            if [ "$GOOS" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "binaries/cassocial-${GOOS}-${GOARCH}${ext}" ./src
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "binaries/cassocial-cli-${GOOS}-${GOARCH}${ext}" ./src/client
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: all-platform-binaries
          path: binaries/
          retention-days: 7

  vuln-scan:
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/share/go/pkg/mod
            /usr/local/share/go/cache
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - run: govulncheck ./...

  license-scan:
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            /usr/local/share/go/pkg/mod
            /usr/local/share/go/cache
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: Check dependency licenses
        run: |
          set -e
          license_report=$(go-licenses csv ./src/...)
          if printf '%s\n' "$license_report" | grep -iE 'GPL|AGPL|LGPL'; then
            echo "::error::Copyleft dependency license detected (GPL, AGPL, or LGPL)"
            exit 1
          fi

  workflow-policy:
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify action pinning and forbidden triggers
        run: |
          fail=0
          for f in .gitea/workflows/*.yml; do
            while IFS= read -r line; do
              case "$line" in
                *uses:*)
                  action_ref="${line##*uses: }"
                  case "$action_ref" in
                    */*@*)
                      ref="${action_ref##*@}"
                      ref="${ref%% *}"
                      if ! printf '%s' "$ref" | grep -qE '^[0-9a-f]{40}$'; then
                        echo "::error file=$f::action not pinned to a 40-char commit SHA: $line"
                        fail=1
                      fi
                      ;;
                    *)
                      echo "::error file=$f::action is missing a pinned commit SHA: $line"
                      fail=1
                      ;;
                  esac
                  ;;
              esac
            done < "$f"
            if grep -qE '^[[:space:]]*(-[[:space:]]*)?pull_request_target[[:space:]]*:' "$f"; then
              echo "::error file=$f::pull_request_target is forbidden"
              fail=1
            fi
          done
          exit "$fail"

  image-scan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: cassocial:ci-scan
      - name: Scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0 image \
            --exit-code 1 --severity CRITICAL,HIGH cassocial:ci-scan

  secret-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Pick the scan scope
        id: scope
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "${{ gitea.event_name }}" = "pull_request" ]; then
            echo "base=${{ gitea.event.pull_request.base.sha }}" >> "$GITEA_OUTPUT"
            echo "head=${{ gitea.event.pull_request.head.sha }}" >> "$GITEA_OUTPUT"
            echo "results=verified,unknown" >> "$GITEA_OUTPUT"
          elif [ "${{ gitea.event_name }}" = "push" ] && [ "${{ gitea.event.before }}" != "$ZERO" ]; then
            echo "base=${{ gitea.event.before }}" >> "$GITEA_OUTPUT"
            echo "head=${{ gitea.event.after }}" >> "$GITEA_OUTPUT"
            echo "results=verified,unknown" >> "$GITEA_OUTPUT"
          else
            echo "results=verified" >> "$GITEA_OUTPUT"
          fi
      - uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341  # v3.99.0
        with:
          base: ${{ steps.scope.outputs.base }}
          head: ${{ steps.scope.outputs.head }}
          extra_args: --results=${{ steps.scope.outputs.results }} --exclude-paths=.github/trufflehog-exclude.txt
