name: Security

on:
  push:
    branches:
      - main
      - master
      - devel
  pull_request:
    branches:
      - main
      - master
      - devel
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ forgejo.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    container: golang:alpine

    steps:
      - name: Install git
        run: apk add --no-cache git

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  workflow-hardening:
    name: Workflow Hardening Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check workflows pin third-party Actions to SHA
        run: |
          FAIL=0
          for wf in .forgejo/workflows/*.yml; do
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^\s+uses: [^@]+@[^#]+$'; then
                ref=$(echo "$line" | grep -oE '@[^#[:space:]]+' | tr -d '@')
                if ! echo "$ref" | grep -qE '^[0-9a-f]{40}$'; then
                  echo "FAIL: $wf — unpinned action: $line"
                  FAIL=1
                fi
              fi
            done < "$wf"
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "All third-party GitHub Actions must be pinned to a full commit SHA."
            exit 1
          fi
          echo "All Actions are pinned to full SHAs."

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab  # v3.95.3
        with:
          path: ./
          extra_args: --only-verified

  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build image for scanning
        run: docker build -f docker/Dockerfile -t cassocial:scan .

      - name: Run Trivy vulnerability scanner
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache:/root/.cache/" \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL,HIGH \
            --no-progress \
            cassocial:scan
